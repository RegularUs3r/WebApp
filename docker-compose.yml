services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - gluetun.env
    restart: unless-stopped

  postgresql:
    image: postgres:17
    environment:
      POSTGRES_USER: foobar
      POSTGRES_PASSWORD: foobar
      POSTGRES_DB: webapp
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foobar -d webapp"]
      interval: 5s
      retries: 5
    restart: unless-stopped
  
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: foobar
      RABBITMQ_DEFAULT_PASS: foobar
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  # web app — NORMAL network
  server:
    build: .
    command: ["npm", "start"]
    ports:
      - "80:4242"
    env_file:
      - .env
    depends_on:
      postgresql: { condition: service_healthy }
      rabbitmq:   { condition: service_healthy }
    restart: unless-stopped

  # fuzz worker — THROUGH the VPN
  worker:
    build: .
    command: ["npm", "run", "start:worker"]
    network_mode: "service:gluetun"
    env_file:
      - .env
    volumes:
      - ./wordlists:/home/ubuntu/WebApp/backend/wordlists:ro
    depends_on:
      gluetun:    { condition: service_healthy }
      postgresql: { condition: service_healthy }
      rabbitmq:   { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
