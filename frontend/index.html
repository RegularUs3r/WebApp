<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2f6fd6">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/images/icon-192.png">
    <script src="/scripts/js/sw-register.js" defer></script>
    <title>AssetMonitor</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        :root {
            --bg: #e5e8ec;
            --card: #f4f5f7;
            --field: #ffffff;
            --grey-1: #d3d8de;
            --grey-2: #9aa3ad;
            --grey-3: #5b6570;
            --blue: #2f6fd6;
            --blue-hover: #2459b0;
            --blue-soft: #dce8fb;
            --text: #121417;
            --black: #121417;
            --radius: 8px;
            color-scheme: light;
        }

        :root[data-theme="dark"] {
            --bg: #16191d;
            --card: #1f2328;
            --field: #2a2f36;
            --grey-1: #363c44;
            --grey-2: #6b7480;
            --grey-3: #aab2bc;
            --blue: #4a8af0;
            --blue-hover: #6ea2f5;
            --blue-soft: rgba(74, 138, 240, 0.25);
            --text: #e3e6ea;
            --black: #000000;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            margin: 0;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            overflow-wrap: anywhere;
            transition: background 0.2s, color 0.2s;
        }

        /* ---------- Header ---------- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: var(--black);
        }

        .topbar img {
            width: 24px;
            height: 24px;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            margin-left: auto;
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            user-select: none;
        }

        .theme-toggle:hover,
        .theme-toggle:focus-visible {
            background: rgba(255, 255, 255, 0.1);
            border-color: #6ea2f5;
            outline: none;
        }

        /* ---------- Layout: OTP card centered in the remaining space ---------- */
        #stuff {
            display: flex;
            flex: 1;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .otp-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: min(360px, 100%);
            padding: 24px;
            background: var(--card);
            border: 1px solid var(--grey-1);
            border-radius: var(--radius);
        }

        .otp-card h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .otp-card p {
            margin: 0;
            color: var(--grey-3);
        }

        .otp-row {
            display: flex;
            gap: 8px;
        }

        /* ---------- Input ---------- */
        input {
            flex: 1;
            min-width: 0;
            padding: 9px 12px;
            background: var(--field);
            color: var(--text);
            border: 1px solid var(--grey-1);
            border-radius: var(--radius);
            font-size: 16px;
            letter-spacing: 0.2em;
            outline: none;
        }

        input::placeholder {
            color: var(--grey-2);
            letter-spacing: normal;
        }

        input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px var(--blue-soft);
        }

        /* ---------- Button ---------- */
        button {
            padding: 9px 18px;
            background: var(--blue);
            color: #ffffff;
            border: 1px solid var(--blue);
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: var(--blue-hover);
            border-color: var(--blue-hover);
        }
    </style>
</head>
<body>
    <header class="topbar">
        <img src="images/favicon.png" alt="">
        <span id="theme-toggle" class="theme-toggle" role="button" tabindex="0"
              aria-label="Switch to dark mode" title="Switch to dark mode">☾</span>
    </header>
    <script>
        const THEME_KEY = "assetmonitor-theme"

        function readSavedTheme() {
            try {
                return localStorage.getItem(THEME_KEY)
            } catch (e) {
                return null
            }
        }

        function saveTheme(theme) {
            try {
                localStorage.setItem(THEME_KEY, theme)
            } catch (e) {
                return
            }
        }

        function getInitialTheme() {
            const saved = readSavedTheme()
            if (saved === "dark" || saved === "light") {
                return saved
            }

            if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                return "dark"
            }
            return "light"
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme)

            const toggle = document.getElementById("theme-toggle")
            if (toggle === null) {
                return
            }

            let label = "Switch to dark mode"
            if (theme === "dark") {
                toggle.textContent = "☀"
                label = "Switch to light mode"
            } else {
                toggle.textContent = "☾"
            }

            toggle.setAttribute("aria-label", label)
            toggle.setAttribute("title", label)
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute("data-theme")
            let next = "dark"
            if (current === "dark") {
                next = "light"
            }

            applyTheme(next)
            saveTheme(next)
        }

        function onToggleKeydown(event) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault()
                toggleTheme()
            }
        }

        applyTheme(getInitialTheme())

        const themeToggle = document.getElementById("theme-toggle")
        themeToggle.addEventListener("click", toggleTheme)
        themeToggle.addEventListener("keydown", onToggleKeydown)
    </script>

    <main class="container" id="stuff">
        <div class="otp-card">
            <h1>Verification</h1>
            <p>Enter the code from your authenticator app.</p>
            <div class="otp-row">
                <input type="text" id="my-otp" placeholder="123456"
                       inputmode="numeric" autocomplete="one-time-code"
                       aria-label="One-time code">
                <button type="submit" onclick="foo()">OK</button>
            </div>
        </div>
    </main>
    <script>
        async function foo(){
            const otp = document.getElementById("my-otp").value
            const data = {"code": otp}
            const response = await fetch('/validateMFA', {
                method: 'POST',
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            })
            if(response.ok){
                window.location.href = '/styled.html'
            }
        }
    </script>
</body>
</html>
