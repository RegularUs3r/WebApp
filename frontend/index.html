<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2f6fd6">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/images/icon-192.png">
    <script src="/scripts/js/sw-register.js" defer></script>
    <title>AssetMonitor</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        #stuff {
            min-height: 100dvh;
            
            justify-content: center;
            align-items: center;
            background-color: lightcoral;
            display: flex;
        }
    </style>
</head>
<body>
    <div class="container" id="stuff">
        <input type="text" id="my-otp">
        <button type="submit" onclick="foo()">OK</button>
    </div>
    <script>
        async function foo(){
            const otp = document.getElementById("my-otp").value
            const data = {"code": otp}
            const response = await fetch('/validateMFA', {
                method: 'POST',
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            })
            if(response.ok){
                window.location.href = '/styled.html'
            }
        }
    </script>
</body>
</html>
