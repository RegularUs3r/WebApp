<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module" src="scripts/js/main.js"></script>
    <link rel="stylesheet" href="styles/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetMonitor</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        :root {
            --bg: #e5e8ec;
            --card: #f4f5f7;
            --field: #ffffff;
            --grey-1: #d3d8de;
            --grey-2: #9aa3ad;
            --grey-3: #5b6570;
            --blue: #2f6fd6;
            --blue-hover: #2459b0;
            --blue-soft: #dce8fb;
            --text: #121417;
            --black: #121417;
            --radius: 8px;
            color-scheme: light;
        }

        :root[data-theme="dark"] {
            --bg: #16191d;
            --card: #1f2328;
            --field: #2a2f36;
            --grey-1: #363c44;
            --grey-2: #6b7480;
            --grey-3: #aab2bc;
            --blue: #4a8af0;
            --blue-hover: #6ea2f5;
            --blue-soft: rgba(74, 138, 240, 0.25);
            --text: #e3e6ea;
            --black: #000000;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            overflow-wrap: anywhere;
            transition: background 0.2s, color 0.2s;
        }

        /* ---------- Header ---------- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: var(--black);
        }

        .topbar img {
            width: 24px;
            height: 24px;
        }

        /* ---------- Theme toggle (span, not <button>, so showContent() ignores it) ---------- */
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            margin-left: auto;
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            user-select: none;
        }

        .theme-toggle:hover,
        .theme-toggle:focus-visible {
            background: rgba(255, 255, 255, 0.1);
            border-color: #6ea2f5;
            outline: none;
        }

        /* ---------- Layout ---------- */
        .container {
            width: min(860px, calc(100% - 32px));
            margin: 20px auto;
        }

        #group-buttons {
            gap: 8px;
        }

        #group-inputs,
        #hooks-view {
            padding: 24px;
            background: var(--card);
            border: 1px solid var(--grey-1);
            border-radius: var(--radius);
        }

        #group-inputs {
            gap: 16px;
        }

        #group-inputs .item {
            width: 100%;
        }

        #inputs {
            gap: 10px;
        }

        #save-add {
            display: flex;
            gap: 8px;
        }

        /* ---------- Checkboxes ---------- */
        #recon_choices {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 16px;
        }

        #recon_choices input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0 4px 0 0;
            accent-color: var(--blue);
            cursor: pointer;
        }

        #recon_choices label {
            margin-right: 8px;
            color: var(--grey-3);
            font-weight: 600;
            cursor: pointer;
        }

        #recon_choices input[type="checkbox"]:checked + label {
            color: var(--blue);
        }

        /* ---------- Inputs / selects ---------- */
        input:not([type="checkbox"]),
        select {
            width: 100%;
            max-width: 500px;
            padding: 9px 12px;
            background: var(--field);
            color: var(--text);
            border: 1px solid var(--grey-1);
            border-radius: var(--radius);
            font-size: 14px;
            outline: none;
        }

        input:not([type="checkbox"])::placeholder {
            color: var(--grey-2);
        }

        input:not([type="checkbox"]):focus,
        select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px var(--blue-soft);
        }

        /* ---------- Buttons ---------- */
        button {
            padding: 9px 18px;
            background: var(--blue);
            color: #ffffff;
            border: 1px solid var(--blue);
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: var(--blue-hover);
            border-color: var(--blue-hover);
        }

        /* Hooks / Settings toggles: grey outline */
        #group-buttons button {
            background: var(--card);
            color: var(--grey-3);
            border-color: var(--grey-2);
        }

        #group-buttons button:hover {
            background: var(--blue-soft);
            color: var(--blue);
            border-color: var(--blue);
        }

        /* "+" button: black square */
        #add {
            min-width: 40px;
            padding: 9px 12px;
            background: var(--black);
            border-color: var(--black);
            font-size: 16px;
            line-height: 1;
        }

        #add:hover {
            background: var(--blue);
            border-color: var(--blue);
        }

        /* ---------- Hooks list (#display_config is built by fetchHooks()) ---------- */
        #display_config {
            gap: 12px;
        }

        #display_config > div {
            width: 100%;
            padding: 16px;
            background: var(--card);
            border: 1px solid var(--grey-1);
            border-radius: var(--radius);
            overflow-x: auto;
        }

        #display_config table {
            width: 100%;
            border-collapse: collapse;
        }

        #display_config td {
            padding: 6px 8px;
            vertical-align: middle;
        }

        #display_config thead:first-child td:first-child {
            color: var(--blue);
            font-weight: 700;
            white-space: nowrap;
        }

        #display_config td input {
            max-width: none;
            padding: 6px 8px;
        }

        #display_config td button {
            width: 100%;
            padding: 6px 10px;
            font-size: 12px;
            white-space: nowrap;
        }

        /* ---------- Notification dot (glowing + pulsing, stays red) ---------- */
        .badge-dot {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 9px;
            height: 9px;
            border-radius: 100%;
            background-color: red;
            border: 2px solid var(--card);
            animation: badge-pulse 1.4s ease-in-out infinite;
        }

        @keyframes badge-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7),
                            0 0 6px 2px rgba(255, 0, 0, 0.6);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(255, 0, 0, 0),
                            0 0 12px 4px rgba(255, 0, 0, 0.9);
                transform: scale(1.18);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0),
                            0 0 6px 2px rgba(255, 0, 0, 0.6);
                transform: scale(1);
            }
        }

        /* Respect users who prefer less motion: keep the glow, drop the pulse */
        @media (prefers-reduced-motion: reduce) {
            .badge-dot {
                animation: none;
                box-shadow: 0 0 8px 2px rgba(255, 0, 0, 0.75);
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <img src="images/favicon.png" alt="">
        <span id="theme-toggle" class="theme-toggle" role="button" tabindex="0"
              aria-label="Switch to dark mode" title="Switch to dark mode">☾</span>
    </header>
    <script>
        const THEME_KEY = "assetmonitor-theme"

        function readSavedTheme() {
            try {
                return localStorage.getItem(THEME_KEY)
            } catch (e) {
                return null
            }
        }

        function saveTheme(theme) {
            try {
                localStorage.setItem(THEME_KEY, theme)
            } catch (e) {
                return
            }
        }

        function getInitialTheme() {
            const saved = readSavedTheme()
            if (saved === "dark" || saved === "light") {
                return saved
            }

            if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                return "dark"
            }
            return "light"
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme)

            const toggle = document.getElementById("theme-toggle")
            if (toggle === null) {
                return
            }

            let label = "Switch to dark mode"
            if (theme === "dark") {
                toggle.textContent = "☀"
                label = "Switch to light mode"
            } else {
                toggle.textContent = "☾"
            }

            toggle.setAttribute("aria-label", label)
            toggle.setAttribute("title", label)
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute("data-theme")
            let next = "dark"
            if (current === "dark") {
                next = "light"
            }

            applyTheme(next)
            saveTheme(next)
        }

        function onToggleKeydown(event) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault()
                toggleTheme()
            }
        }

        applyTheme(getInitialTheme())

        const themeToggle = document.getElementById("theme-toggle")
        themeToggle.addEventListener("click", toggleTheme)
        themeToggle.addEventListener("keydown", onToggleKeydown)
    </script>

    <div class="container" id="group-buttons">
        <div class="item">
            <button type="submit" id="display_hooks" style="display: block;">Hooks</button>
        </div>
        <div class="item">
            <button type="submit" id="display_settings" style="display: none;">Settings</button>
        </div>
    </div>
    <div class="container" id="group-inputs" style="display: flex">
        <div class="item" id="recon_choices">
            <input type="checkbox" id="c99" value="c99">
            <label for="c99">c99</label>
            <input type="checkbox" id="subfinder" value="subfinder">
            <label for="subfinder">Subfinder</label>
        </div>
        <div class="item" id="inputs">
            <input type="text" id="program" placeholder="Program Name" oninput="">
            <input type="text" id="dischook" placeholder="Discord Webhook URL">
            <select id="cron">
                <option>Cronjob</option>
                <option>1M</option>
                <option>1H</option>
                <option>2H</option>
                <option>3H</option>
                <option>4H</option>
                <option>5H</option>
                <option>6H</option>
                <option>7H</option>
                <option>8H</option>
                <option>9H</option>
                <option>10H</option>
                <option>11H</option>
                <option>12H</option>
            </select>
            <input id="input-target" type="text" placeholder="domain.io">
        </div>
        <div class="item" id="save-add">
            <button value="submit" id="recon">Add Target(s)</button>
            <button value="submit" id="add">+</button>
        </div>
    </div>
    <div class="container" id="hooks-view" style="display: none;"></div>
    <script>
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function addRedDot(buttonId) {
            const button = document.getElementById(buttonId)
            if (button === null) {
                return
            }

            if (button.querySelector(".badge-dot") !== null) {
                return
            }

            button.style.position = "relative"

            const dot = document.createElement("span")
            dot.className = "badge-dot"
            button.appendChild(dot)
        }

        function removeRedDot(buttonId) {
            const button = document.getElementById(buttonId)
            if (button === null) {
                return
            }

            const dot = button.querySelector(".badge-dot")
            if (dot !== null) {
                dot.remove()
            }
        }

        window.onload = async function run() {
            const r = await fetch('/api/getcrons')
            const data = await r.json()
            console.log(data)
            for(const button_id of data.status){
                addRedDot(button_id)
            }
        }
    </script>
</body>
</html>
